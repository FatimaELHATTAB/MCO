-- ============================================================
-- 1. PREPARE UP TO 30,000 ROWS
-- ============================================================

BEGIN;

WITH batch AS MATERIALIZED (
    SELECT id, tpn_id, created_at
    FROM tax
    WHERE tax_id_status = 'VIES_ERROR'
      AND closed_at IS NULL
      AND created_by IS NOT NULL
      AND flux_execution_id > 0
    ORDER BY id
    LIMIT 30000
),
previous_versions AS MATERIALIZED (
    -- Find the latest previous version using a grouped join.
    SELECT DISTINCT ON (b.id)
        b.id AS current_id,
        h.tpn_id,
        h.tax_id,
        h.tax_id_status,
        h.tax_label,
        h.business_validity_from,
        h.business_validity_to,
        h.flux_execution_id
    FROM batch AS b
    JOIN tax AS h
      ON h.tpn_id = b.tpn_id
     AND (h.created_at, h.id) < (b.created_at, b.id)
    WHERE h.closed_at IS NOT NULL
      AND h.closed_by IS DISTINCT FROM 'CIB_RETRY'
    ORDER BY
        b.id,
        h.created_at DESC,
        h.id DESC
),
closed_rows AS (
    -- Close current rows with an eligible previous version.
    UPDATE tax AS t
    SET closed_at = CURRENT_TIMESTAMP,
        closed_by = 'CIB_RETRY'
    FROM previous_versions AS p
    WHERE t.id = p.current_id
      AND p.flux_execution_id > 0
    RETURNING t.id
),
inserted_rows AS (
    -- Create a new active copy of the previous version.
    -- Keep the historical version unchanged.
    INSERT INTO tax (
        tpn_id,
        tax_id,
        tax_id_status,
        tax_label,
        business_validity_from,
        business_validity_to,
        created_at,
        created_by,
        closed_at,
        closed_by,
        flux_execution_id
    )
    SELECT
        p.tpn_id,
        p.tax_id,
        p.tax_id_status,
        p.tax_label,
        p.business_validity_from,
        p.business_validity_to,
        CURRENT_TIMESTAMP,
        'CIB_RETRY|TVA_OLD_FLUX=' || p.flux_execution_id::text,
        NULL,
        NULL,
        0
    FROM previous_versions AS p
    JOIN closed_rows AS c ON c.id = p.current_id
    RETURNING id
),
updated_rows AS (
    -- No previous version: prepare the existing row.
    -- Do not close it or create a new row.
    UPDATE tax AS t
    SET created_by = t.created_by
                     || '|TVA_OLD_FLUX='
                     || t.flux_execution_id::text,
        flux_execution_id = 0
    FROM batch AS b
    WHERE t.id = b.id
      AND NOT EXISTS (
          SELECT 1
          FROM previous_versions AS p
          WHERE p.current_id = b.id
      )
    RETURNING t.id
)
SELECT
    (SELECT COUNT(*) FROM inserted_rows) AS new_rows,
    (SELECT COUNT(*) FROM updated_rows) AS existing_rows_prepared;

COMMIT;


-- ============================================================
-- STOP HERE: do not execute the whole script in one run.
-- Trigger the usual TVA notification for flux_execution_id = 0.
-- Wait until TVA has fully finished before running section 2.
-- ============================================================


-- ============================================================
-- 2. RESTORE THE ORIGINAL FLUX AND CLEAN UP
-- ============================================================

BEGIN;

-- Read saved flux IDs from active and closed rows.
-- Restore existing rows and new rows created by TVA.
WITH saved_flux AS MATERIALIZED (
    SELECT DISTINCT
        tpn_id,
        split_part(
            created_by,
            '|TVA_OLD_FLUX=',
            2
        )::bigint AS original_flux
    FROM tax
    WHERE strpos(created_by, '|TVA_OLD_FLUX=') > 0
)
UPDATE tax AS t
SET flux_execution_id = s.original_flux
FROM saved_flux AS s
WHERE t.tpn_id = s.tpn_id
  AND t.flux_execution_id = 0;

-- Remove the temporary suffix.
UPDATE tax
SET created_by = split_part(created_by, '|TVA_OLD_FLUX=', 1)
WHERE strpos(created_by, '|TVA_OLD_FLUX=') > 0;

COMMIT;
