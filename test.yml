Intégration de l’API d’immatriculation
Permettre l’attribution d’un TPN ID aux sources qui le nécessitent, notamment OSRRCX. Le périmètre actuel se limite au RMPM, pour lequel cette attribution n’est pas obligatoire.
Consolidation et validation de la priorisation des sources internes
Revoir les règles existantes et les tester sur des données multisources : un premier jet a été réalisé, mais n’a pas pu être validé faute de données.
Gestion des suppressions dans les flux delta
Implémenter la prise en charge des suppressions pour les sources internes et externes. La mise à jour est déjà implémentée pour les sources internes.
