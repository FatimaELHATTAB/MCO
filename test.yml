BEGIN;

-- Restaurer sur les lignes d’origine et les nouvelles lignes.
UPDATE tax AS cible
SET flux_execution_id = substring(
        source.created_by
        FROM '[|]TVA_OLD_FLUX=([0-9]+)$'
    )::bigint
FROM tax AS source
WHERE cible.tpn_id = source.tpn_id
  AND cible.flux_execution_id = 0
  AND source.created_by ~ '[|]TVA_OLD_FLUX=[0-9]+$';

-- Retirer uniquement le suffixe ajouté.
UPDATE tax
SET created_by = regexp_replace(
    created_by,
    '[|]TVA_OLD_FLUX=[0-9]+$',
    ''
)
WHERE created_by ~ '[|]TVA_OLD_FLUX=[0-9]+$';

COMMIT;


BEGIN;

WITH batch AS (
    SELECT id
    FROM tax
    WHERE tax_id_status = 'VES_error'
      AND closed_at IS NULL
      AND created_by IS NOT NULL
      AND flux_execution_id <> 0
      AND created_by NOT LIKE '%|TVA_OLD_FLUX=%'
    ORDER BY id
    LIMIT 30000
)
UPDATE tax AS t
SET created_by = t.created_by
                 || '|TVA_OLD_FLUX='
                 || t.flux_execution_id::text,
    flux_execution_id = 0
FROM batch AS b
WHERE t.id = b.id;

COMMIT;
